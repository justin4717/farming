<html>
<head>
<title>Create account</title>
<style>
body {
  background-image:url("adm.jpg");
}
form {
  width: 30%;
  margin: 60px auto;
  background:gray;
  padding: 30px 50px 60px 80px;
  text-align: center;
  color:white;
	
  
}
label {
  display: block;
  position: relative;
  margin: 20px 0px;
}
.label-txt {
  position: absolute;
  top: -1.6em;
  padding: 10px;
  font-family: sans-serif;
  font-size: .8em;
  letter-spacing: 1px;
  color: white;
  transition: ease .3s;
}
::placeholder{
color:white;
}
.input {
  width: 100%;
  padding: 10px;
  background: transparent;
  border: none;
  outline: none;
  color:white;
}

.line-box {
  position: relative;
  width: 100%;
  height: 2px;
  background: #BCBCBC;
}

.line {
  position: absolute;
  width: 0%;
  height: 2px;
  top: 0px;
  left: 50%;
  transform: translateX(-50%);
  background: #8BC34A;
  transition: ease .6s;
}

.input:focus + .line-box .line {
  width: 100%;
}

.label-active {
  top: -3em;
}

button {
  display: inline-block;
  padding: 12px 24px;
  background: rgb(220,220,220);
  font-weight: bold;
  color: rgb(120,120,120);
  border: none;
  outline: none;
  border-radius: 3px;
  cursor: pointer;
  transition: ease .3s;
}

button:hover {
  background: #8BC34A;
  color: #ffffff;
}
.container1 {
	background-color: #FFFFFF;
	
}
header {
	margin-top:15px;

.he{
        margin-left:555px;

	 }

}
th{
color:white;
}
</style>
<script>

function psw()
{
 var pw=document.getElementById('ps').value;
 var d=/^[a-zA-Z0-9@]+$/;
 if (pw=="")
 {
   document.getElementById('p1').innerHTML="*enter eassword";
   pw.onfocus();
   count++;
   return false;
 }
 if(pw.match(d))
 {
 document.getElementById('p1').innerHTML="";

 }
 else
 { 
    document.getElementById('p1').innerHTML="*enter valid password";
	return true;
	}
}

function unames()
{
 var nam=document.getElementById('un').value;
 var l=/^[A-Za-z]+$/;
 if (nam=="")
 {
   document.getElementById('p6').innerHTML="*enter user name";
   count++;
   return false;
 }
 if(nam.match(l))
 {
 document.getElementById('p6').innerHTML="";

 }
 else
 { 
   document.getElementById('p6').innerHTML="*enter valid user name";
   count++;
	return false;
	}
}
function em()
{
 var e=document.getElementById('e').value;
 var l=/^([a-zA-Z0-9_\-\.]+)@([a-zA-Z0-9_\-\.]+)\.([a-zA-Z]{2,5})+$/;
 if (e=="")
 {
  document.getElementById('p4').innerHTML="*enter email";
  count++;
   return false;
 }
 if(e.match(l))
 {
  document.getElementById('p4').innerHTML="";

 }
 else
 { 
     document.getElementById('p4').innerHTML="*enter valid email";
	return true;
	}
}

function num()
{
 var nu=document.getElementById('nm').value;
 var d=/^[0][1-9]\d{9}$|^[1-9]\d{9}$/;
 if (nu=="")
 {
  document.getElementById('p5').innerHTML="*enter  number";
  count++;
   return false;
 }
 if(nu.match(d))
 {
 document.getElementById('p5').innerHTML="";

 }
 else
 { 
    document.getElementById('p5').innerHTML="*enter valid number";
	return false;
	}
}

</script>
