	{

		{
		alert("Enter Username");
		count++;
		return false;
		}
	if(txt1.match(txt2))
		{
		count=0;
		pass();
		}
	else
		{
		alert("Invalid Username");
	    count++;
		return false;
		}
		}
	function pass()
	{
	var pas=document.getElementById("ps1").value;
	var pas1=/^[a-zA-Z0-9@]+$/;
	
	if(pas=="")
		{
     
		alert("Enter password");
		count++;
		return false;
		}
	else if((pas.match(pas1))&& (pas.length > 8))
		{
		count=0;
		}
	else
		{
		alert("Invalid password");
		 count++;
		return false;
		}
	}
	function rk()

	{

	}
	}
